<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schlemmerkarte &middot; Karlsruhe</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1113;
  --wine:#740021;
  --paper:#F7F1E8;
  --stub:#FFFDF9;
  --gold:#B8871B;
  --muted:#7C6B6F;
  --line:#E2D6C6;
  --ok:#3F6B4A;
  --r:10px;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-data:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--font-body);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--wine)}

/* ---------------------------------------------------------------- header */
.masthead{
  background:var(--wine);color:#F7EDE2;padding:14px 16px 12px;
  border-bottom:3px solid var(--ink);
}
.masthead h1{
  font-family:var(--font-display);font-weight:800;font-size:23px;
  letter-spacing:-0.02em;margin:0;line-height:1;
}
.masthead .sub{
  font-family:var(--font-data);font-size:10.5px;letter-spacing:0.14em;
  text-transform:uppercase;opacity:.72;margin-top:6px;
}
.masthead .tally{float:right;text-align:right;font-family:var(--font-data)}
.masthead .tally b{font-size:23px;display:block;line-height:1;font-weight:700}
.masthead .tally span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.72}

/* --------------------------------------------------------------- controls */
.controls{background:var(--stub);border-bottom:1px solid var(--line);padding:12px 16px 14px}
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow input[type=search]{
  flex:1;min-width:0;font:inherit;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:var(--r);background:#fff;color:var(--ink);
}
.searchrow input[type=search]:focus{outline:2px solid var(--wine);outline-offset:1px;border-color:transparent}
.geo{
  padding:10px 12px;border:1.5px solid var(--wine);border-radius:var(--r);
  background:#fff;color:var(--wine);font-weight:600;white-space:nowrap;
}
.geo[data-on="1"]{background:var(--wine);color:#fff}

.grouplabel{
  font-family:var(--font-data);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:14px 0 7px;
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1.5px solid var(--line);background:#fff;border-radius:100px;
  padding:5px 11px;font-size:13px;font-weight:500;line-height:1.3;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .n{font-family:var(--font-data);font-size:10.5px;opacity:.5;margin-left:5px}

.sliderrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.sliderrow input[type=range]{flex:1;accent-color:var(--wine)}
.sliderrow output{font-family:var(--font-data);font-size:12.5px;min-width:62px;text-align:right}
.togglerow{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;align-items:center}
.togglerow label{display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}
.togglerow input{accent-color:var(--wine);width:16px;height:16px}
.blocks{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13.5px}
.blocks button{
  width:26px;height:26px;border:1.5px solid var(--line);background:#fff;
  border-radius:7px;font-weight:700;line-height:1;
}
.blocks b{font-family:var(--font-data);min-width:14px;text-align:center}

/* ------------------------------------------------------------------- view */
.viewtabs{display:flex;border-bottom:1px solid var(--line);background:var(--stub)}
.viewtabs button{
  flex:1;padding:11px;background:none;border:none;border-bottom:3px solid transparent;
  font-family:var(--font-data);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.viewtabs button[aria-selected="true"]{color:var(--wine);border-bottom-color:var(--wine)}

.stage{display:block}
#map{height:52vh;min-height:300px;background:#DED3C4;z-index:0}
.results{padding:14px 16px 40px;display:grid;gap:12px}

@media (min-width:900px){
  .viewtabs{display:none}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 420px;height:calc(100vh - 210px)}
  #map{height:100%}
  .results{overflow-y:auto;border-left:1px solid var(--line);background:var(--paper)}
  .pane{display:block !important}
}

/* ------------------------------------------------------------ ticket stub */
.stub{
  position:relative;background:var(--stub);border:1.5px solid var(--line);
  border-radius:var(--r);padding:13px 14px 13px 17px;overflow:hidden;
}
.stub::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--wine);
}
.stub::after{ /* Perforation */
  content:"";position:absolute;left:9px;top:6px;bottom:6px;width:1px;
  background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 9px);
}
.stub.is-spent{opacity:.55}
.stub.is-spent .name{text-decoration:line-through;text-decoration-color:var(--wine)}
.stub.is-inactive{border-style:dashed}

.stub .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.2;margin:0}
.dist{font-family:var(--font-data);font-size:12px;color:var(--wine);white-space:nowrap;font-weight:700}
.meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.meta .dot{opacity:.4;margin:0 5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{
  font-family:var(--font-data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted);
}
.tag.kind{border-color:var(--gold);color:var(--gold)}
.tag.off{border-color:var(--wine);color:var(--wine)}

.actions{display:flex;align-items:center;gap:8px;margin-top:11px}
.redeem{
  border:1.5px solid var(--wine);background:var(--wine);color:#fff;font-weight:600;
  border-radius:var(--r);padding:7px 13px;font-size:13.5px;
}
.redeem[disabled]{background:#fff;color:var(--muted);border-color:var(--line);cursor:default}
.undo{border:none;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline}
.left{font-family:var(--font-data);font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.links{display:flex;gap:12px;margin-top:9px;font-size:12.5px}
.links a{text-decoration:none;border-bottom:1px solid rgba(116,0,33,.3)}

.empty{
  text-align:center;padding:38px 16px;color:var(--muted);
  border:1.5px dashed var(--line);border-radius:var(--r);
}
.empty b{display:block;font-family:var(--font-display);font-size:17px;color:var(--ink);margin-bottom:5px}

#notice{
  background:#FDF3D8;border-bottom:1px solid var(--gold);color:#6B5310;
  padding:11px 16px;font-size:13.5px;line-height:1.45;
}
#notice b{font-family:var(--font-display);display:block;margin-bottom:2px;color:var(--ink)}
#notice code{font-family:var(--font-data);font-size:12px;background:#fff;
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}

.footbar{
  padding:16px;border-top:1px solid var(--line);background:var(--stub);
  font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;align-items:center;
}
.footbar button{background:none;border:none;text-decoration:underline;color:var(--muted);font-size:12px;padding:0}

/* Leaflet-Popup an die Karte anpassen */
.leaflet-popup-content-wrapper{border-radius:var(--r)}
.leaflet-popup-content{margin:11px 13px;font-family:var(--font-body);font-size:13.5px}
.leaflet-popup-content .pname{font-family:var(--font-display);font-weight:600;font-size:15px;display:block;margin-bottom:3px}
.pin{
  width:16px;height:16px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.me{width:14px;height:14px;border-radius:50%;background:#2C6BB3;border:3px solid #fff;box-shadow:0 0 0 4px rgba(44,107,179,.25)}

@media (prefers-reduced-motion:no-preference){
  .stub{transition:opacity .18s ease}
}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
</style>
</head>
<body>

<header class="masthead">
  <div class="tally"><b id="tallyLeft">–</b><span>offen</span></div>
  <h1>Schlemmerkarte</h1>
  <div class="sub" id="edition">–</div>
</header>

<section class="controls">
  <div class="searchrow">
    <input type="search" id="q" placeholder="Name suchen – z.B. Pizza, Osteria, Durlach" aria-label="Suche">
    <button class="geo" id="geo" data-on="0">Standort</button>
  </div>

  <div class="grouplabel">Was</div>
  <div class="chips" id="catChips"></div>

  <div class="grouplabel">Küche</div>
  <div class="chips" id="cuiChips"></div>

  <div class="grouplabel">Umkreis</div>
  <div class="sliderrow">
    <input type="range" id="rad" min="1" max="60" value="60" step="1" aria-label="Umkreis in Kilometern">
    <output id="radOut">alle</output>
  </div>

  <div class="togglerow">
    <label><input type="checkbox" id="onlyOpen" checked> nur offene Gutscheine</label>
    <span class="blocks">
      Blöcke <button id="bMinus" aria-label="weniger Blöcke">–</button>
      <b id="bCount">1</b>
      <button id="bPlus" aria-label="mehr Blöcke">+</button>
    </span>
  </div>
</section>

<div class="viewtabs" role="tablist">
  <button id="tabMap" role="tab" aria-selected="true" aria-controls="map">Karte</button>
  <button id="tabList" role="tab" aria-selected="false" aria-controls="results">Liste</button>
</div>

<div id="notice" hidden></div>

<div class="stage">
  <div id="map" class="pane"></div>
  <div class="results pane" id="results" style="display:none"></div>
</div>

<div class="footbar">
  <span id="stat">–</span>
  <button id="exp">Stand kopieren</button>
  <button id="imp">Stand einfügen</button>
  <button id="reset">Alles zurücksetzen</button>
  <span style="margin-left:auto">Daten: gutscheinbuch.de</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Datenquelle: standardmaessig data.json neben dieser Datei.
   Mit ?data=<URL> laesst sich jede andere JSON-Quelle laden, z.B.
   ?data=https://raw.githubusercontent.com/<user>/<repo>/main/data.json      */
const DATA_URL = new URLSearchParams(location.search).get("data") || "data.json";
let DATA = null, items = [];

/* ---------------------------------------------------------------- Zustand */
const KEY = "schlemmerkarte.v1";
let state = {blocks:1, used:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) state = Object.assign(state, JSON.parse(raw)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

const usedOf  = id => state.used[id] || 0;
const totalOf = i  => (i.remaining || 1) * state.blocks;
const leftOf  = i  => Math.max(0, totalOf(i) - usedOf(i.id));

/* -------------------------------------------------------------- Filter-UI */
const CAT_COLOR = {
  restaurant:"#740021", special:"#8E2A46", fastfood:"#B8871B",
  breakfast:"#3F6B4A", cafe:"#2C6BB3", drinks:"#5C3A7A", leisure:"#B5541C"
};
const filters = {q:"", cats:new Set(), cuis:new Set(), radius:null,
                 onlyOpen:true, onlyActive:true};
let here = null;

const $ = s => document.querySelector(s);

const catsOf = i => i.categories.map(c => DATA.categories[c] || c).join(" · ");

function countBy(kind, val){
  return items.filter(i => kind === "cat" ? i.categories.includes(val)
                                          : i.cuisines.includes(val)).length;
}
function chip(container, value, label, n, set){
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed","false");
  b.innerHTML = label + (n ? ` <span class="n">${n}</span>` : "");
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", String(!on));
    on ? set.delete(value) : set.add(value);
    render();
  };
  container.appendChild(b);
}
function buildChips(){
  Object.entries(DATA.categories).forEach(([k,label]) => {
    const n = countBy("cat", k); if(n) chip($("#catChips"), k, label, n, filters.cats);
  });
  const cuis = [...new Set(items.flatMap(i => i.cuisines))]
    .sort((a,b) => countBy("cui",b) - countBy("cui",a));
  cuis.forEach(c =>
    chip($("#cuiChips"), c, DATA.cuisineLabels[c] || c, countBy("cui",c), filters.cuis));
  if(!cuis.length) $("#cuiChips").previousElementSibling.style.display = "none";
}

/* -------------------------------------------------------------- Entfernung */
function km(a, b){
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b[0]-a[0]), dLon = rad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
const fmtKm = d => d < 1 ? Math.round(d*1000) + " m" : d.toFixed(d < 10 ? 1 : 0) + " km";

/* ------------------------------------------------------------------ Karte */
const map = L.map("map", {scrollWheelZoom:true}).setView([49.0069, 8.4037], 11);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
  maxZoom:19, subdomains:"abcd",
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);
const markerLayer = L.layerGroup().addTo(map);
let meMarker = null;

const pinIcon = cat => L.divIcon({className:"", iconSize:[16,16], iconAnchor:[8,16],
  html:`<div class="pin" style="background:${CAT_COLOR[cat]||"#740021"}"></div>`});

/* ---------------------------------------------------------------- Filtern */
function matches(i){
  if(filters.onlyOpen && leftOf(i) === 0) return false;
  if(filters.cats.size && !i.categories.some(c => filters.cats.has(c))) return false;
  if(filters.cuis.size && !i.cuisines.some(c => filters.cuis.has(c))) return false;
  if(filters.q){
    const hay = [i.name, i.address, i.plz, i.city, catsOf(i),
                 i.cuisines.map(c => DATA.cuisineLabels[c]||c).join(" ")]
                .join(" ").toLowerCase();
    if(!hay.includes(filters.q)) return false;
  }
  if(filters.radius !== null && here){
    if(i.lat === null) return false;
    if(km(here, [i.lat, i.lon]) > filters.radius) return false;
  }
  return true;
}

function card(i, dist){
  const left = leftOf(i), spent = left === 0, total = totalOf(i);
  const el = document.createElement("article");
  el.className = "stub" + (spent ? " is-spent" : "");
  const rating = i.rating ? `<span class="dot">·</span>★ ${i.rating.toFixed(2)}` : "";
  el.innerHTML = `
    <div class="top">
      <h3 class="name">${i.name}</h3>
      ${dist !== null ? `<span class="dist">${fmtKm(dist)}</span>` : ""}
    </div>
    <div class="meta">${i.address}${rating}</div>
    <div class="tags">
      ${i.categories.map(c => `<span class="tag">${DATA.categories[c]||c}</span>`).join("")}
      ${i.cuisines.map(c => `<span class="tag kind">${DATA.cuisineLabels[c]||c}</span>`).join("")}
      ${i.lat === null ? `<span class="tag off">Standort fehlt</span>` : ""}
    </div>
    <div class="actions">
      <button class="redeem" ${spent ? "disabled" : ""}>${spent ? "eingelöst" : "einlösen"}</button>
      ${usedOf(i.id) ? `<button class="undo">zurücknehmen</button>` : ""}
      <span class="left">${left} von ${total} offen</span>
    </div>
    <div class="links">
      ${i.url ? `<a href="${i.url}" target="_blank" rel="noopener">Gutschein ansehen</a>` : ""}
      <a href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(
          i.lat !== null ? i.lat + "," + i.lon : i.address)}"
         target="_blank" rel="noopener">Route in Google Maps</a>
    </div>`;
  el.querySelector(".redeem").onclick = () => {
    if(spent) return;
    state.used[i.id] = usedOf(i.id) + 1; save(); render();
  };
  const undo = el.querySelector(".undo");
  if(undo) undo.onclick = () => {
    state.used[i.id] = Math.max(0, usedOf(i.id) - 1);
    if(!state.used[i.id]) delete state.used[i.id];
    save(); render();
  };
  if(i.lat !== null){
    const h = el.querySelector(".name");
    h.style.cursor = "pointer";
    h.onclick = () => { map.setView([i.lat, i.lon], 16);
                        if(window.innerWidth < 900) showPane("map"); };
  }
  return el;
}

function render(){
  const shown = items.filter(matches).map(i => ({
    i, d: (here && i.lat !== null) ? km(here, [i.lat, i.lon]) : null
  }));
  shown.sort((a,b) =>
    (a.d === null) - (b.d === null) ||
    (a.d !== null ? a.d - b.d : a.i.name.localeCompare(b.i.name, "de")));

  const box = $("#results"); box.innerHTML = "";
  if(!shown.length){
    box.innerHTML = `<div class="empty"><b>Nichts gefunden</b>
      Filter lockern – oder „nur offene Gutscheine“ abwählen,
      um bereits eingelöste wieder zu sehen.</div>`;
  } else shown.forEach(({i,d}) => box.appendChild(card(i,d)));

  markerLayer.clearLayers();
  shown.filter(({i}) => i.lat !== null).forEach(({i,d}) => {
    L.marker([i.lat, i.lon], {icon:pinIcon(i.categories[0]), title:i.name})
      .bindPopup(`<span class="pname">${i.name}</span>
        ${catsOf(i)}${d !== null ? " · " + fmtKm(d) : ""}<br>${i.address}<br>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${i.lat},${i.lon}"
           target="_blank" rel="noopener">Route</a>
        ${i.url ? ` · <a href="${i.url}" target="_blank" rel="noopener">Gutschein</a>` : ""}`)
      .addTo(markerLayer);
  });

  const located = items.filter(i => i.lat !== null).length;
  $("#tallyLeft").textContent = items.filter(i => leftOf(i) > 0).length;
  $("#stat").textContent =
    `${shown.length} von ${items.length} Einträgen · ${located} verortet`
    + (located < items.length ? ` · ${items.length - located} ohne Koordinate` : "");
  $("#bCount").textContent = state.blocks;
}

/* ------------------------------------------------------------- Bedienung */
$("#q").oninput = e => { filters.q = e.target.value.trim().toLowerCase(); render(); };
$("#onlyOpen").onchange = e => { filters.onlyOpen = e.target.checked; render(); };
$("#rad").oninput = e => {
  const v = +e.target.value;
  filters.radius = v >= 60 ? null : v;
  $("#radOut").textContent = v >= 60 ? "alle" : v + " km";
  render();
};
$("#bPlus").onclick = () => { state.blocks++; save(); render(); };
$("#bMinus").onclick = () => { state.blocks = Math.max(1, state.blocks-1); save(); render(); };

$("#geo").onclick = () => {
  if(!navigator.geolocation){ alert("Standort wird vom Browser nicht unterstützt."); return; }
  $("#geo").textContent = "suche …";
  navigator.geolocation.getCurrentPosition(p => {
    here = [p.coords.latitude, p.coords.longitude];
    $("#geo").textContent = "Standort an"; $("#geo").dataset.on = "1";
    if(meMarker) map.removeLayer(meMarker);
    meMarker = L.marker(here, {icon:L.divIcon({className:"",iconSize:[14,14],html:'<div class="me"></div>'})}).addTo(map);
    map.setView(here, 13);
    render();
  }, err => {
    $("#geo").textContent = "Standort";
    alert("Standort nicht verfügbar: " + err.message +
          "\nGeolocation braucht https:// oder localhost.");
  }, {enableHighAccuracy:true, timeout:10000});
};

function showPane(which){
  const m = $("#map"), r = $("#results");
  if(window.innerWidth >= 900){ m.style.display = "block"; r.style.display = "block"; return; }
  m.style.display = which === "map" ? "block" : "none";
  r.style.display = which === "list" ? "block" : "none";
  $("#tabMap").setAttribute("aria-selected", String(which === "map"));
  $("#tabList").setAttribute("aria-selected", String(which === "list"));
  if(which === "map") setTimeout(() => map.invalidateSize(), 60);
}
$("#tabMap").onclick = () => showPane("map");
$("#tabList").onclick = () => showPane("list");
window.addEventListener("resize", () =>
  showPane($("#tabList").getAttribute("aria-selected") === "true" ? "list" : "map"));

$("#exp").onclick = async () => {
  const s = JSON.stringify(state);
  try{ await navigator.clipboard.writeText(s); $("#exp").textContent = "kopiert"; }
  catch(e){ prompt("Stand kopieren:", s); }
  setTimeout(() => $("#exp").textContent = "Stand kopieren", 1500);
};
$("#imp").onclick = () => {
  const s = prompt("Stand einfügen:");
  if(!s) return;
  try{ state = Object.assign({blocks:1,used:{}}, JSON.parse(s)); save(); render(); }
  catch(e){ alert("Das war kein gültiger Stand."); }
};
$("#reset").onclick = () => {
  if(confirm("Alle eingelösten Gutscheine zurücksetzen?")){
    state = {blocks:state.blocks, used:{}}; save(); render();
  }
};

/* ------------------------------------------------------------------ Laden */
function note(html){
  const n = $("#notice"); n.innerHTML = html; n.hidden = false;
}
function fatal(msg, detail){
  $("#results").innerHTML = `<div class="empty"><b>${msg}</b>${detail}</div>`;
  $("#stat").textContent = "keine Daten geladen";
  showPane("list");
}

showPane("map");
$("#stat").textContent = "lade Daten \u2026";

fetch(DATA_URL, {cache:"no-cache"})
  .then(r => { if(!r.ok) throw new Error(r.status + " " + r.statusText); return r.json(); })
  .then(json => {
    DATA = json; items = DATA.items || [];
    $("#edition").textContent = DATA.edition || "";
    buildChips();
    render();
    const withGeo = items.filter(i => i.lat !== null);
    if(withGeo.length){
      map.fitBounds(L.latLngBounds(withGeo.map(i => [i.lat, i.lon])).pad(0.1));
      if(withGeo.length < items.length) note(
        `<b>${items.length - withGeo.length} von ${items.length} Eintr\u00e4gen ohne Koordinate</b>
         Sie stehen in der Liste, aber nicht auf der Karte \u2013 in
         <code>geo_cache.json</code> nachtragen.`);
    } else {
      note(`<b>Noch keine Koordinaten \u2013 die Karte bleibt leer</b>
        Alle ${items.length} Eintr\u00e4ge sind unter <b>Liste</b> da. F\u00fcr die Karte
        einmal <code>python3 build_data.py --geocode</code> laufen lassen
        (ca. 3 Minuten), dann <code>data.json</code> neu laden.`);
      showPane("list");
    }
  })
  .catch(err => {
    const local = location.protocol === "file:";
    fatal(local ? "Aus einer lokalen Datei geht das nicht"
                : "Daten konnten nicht geladen werden",
      local ? "Der Browser blockiert fetch() auf file://. Im Ordner "
              "<code>python3 -m http.server 8000</code> starten und "
              "<code>http://localhost:8000/</code> \u00f6ffnen."
            : `<code>${DATA_URL}</code> \u2013 ${err.message}`);
  });
</script>
</body>
</html>
